[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jyotish-map"
version = "0.1.0"
description = "Конвейер разбора карты Джйотиш поверх vedic-parser"
requires-python = ">=3.10"
dependencies = [
    "vedic-parser @ git+https://github.com/serg123e/vedic-parser",
    "PyYAML>=6",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
# Второй, независимый источник данных для команды crosscheck. MIT, эфемериды
# NASA JPL через skyfield — без AGPL-обязательств Swiss Ephemeris.
crosscheck = ["jyotishganit>=0.1.3", "skyfield>=1.45"]
# Локальный расчёт (второй источник и, по величинам, первый). AGPL: PyJHora и
# Swiss Ephemeris. Остальное — то, что PyJHora импортирует, но не объявляет.
local = ["PyJHora>=4.8.7", "pyswisseph>=2.10", "geocoder", "pytz", "timezonefinder", "geopy"]

[project.scripts]
jyotish = "jyotish.cli:main"

[tool.setuptools.packages.find]
include = ["jyotish*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
